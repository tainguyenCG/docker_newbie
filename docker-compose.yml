services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: landing_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-YourStrong@Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: landing_backend
    environment:
      PORT: 3000
      MSSQL_HOST: sqlserver
      MSSQL_PORT: 1433
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${SA_PASSWORD:-YourStrong@Passw0rd}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-LandingDB}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      sqlserver:
        condition: service_healthy

  client:
    build: ./frontend-client
    container_name: landing_client
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      - backend

  admin:
    build: ./frontend-admin
    container_name: landing_admin
    environment:
      PORT: 4322
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4322:4322"
    depends_on:
      - backend

volumes:
  mssql_data:
